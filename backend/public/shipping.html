<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Shax Store — Shipping Information">
  <title>Shipping Info — Shax Store</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Shared stylesheet (same folder as index.html) -->
  <link rel="stylesheet" href="style.css">
  <!-- Theme controller: sets data-theme before first paint (no flash) -->
  <script src="theme.js"></script>

  <style>
    .page-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 120px 24px 90px;
      min-height: 70vh;
    }
    .page-head {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeUp .6s ease both;
    }
    .page-head .page-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: var(--black);
      margin: 0 auto 20px;
      box-shadow: 0 0 0 6px rgba(201,168,76,0.12);
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .page-title span { color: var(--gold); }
    .page-subtitle { color: var(--white-dim); font-size: 1rem; }

    .content-card {
      background: var(--black-card);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: var(--radius-lg);
      padding: 40px;
      animation: fadeUp .7s ease both;
      animation-delay: .1s;
    }
    /* Admin text rendered with line breaks preserved */
    .content-body {
      color: var(--white-dim);
      font-size: 1rem;
      line-height: 1.9;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .content-loading, .content-empty {
      text-align: center; padding: 40px 20px; color: var(--white-dim);
    }
    .content-loading i, .content-empty i {
      font-size: 2.4rem; color: var(--gray-light);
      display: block; margin-bottom: 14px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .page-wrap { padding: 100px 16px 70px; }
      .content-card { padding: 26px 20px; }
      /* Notch devices: keep the page header clear of the status bar */
      @supports (padding-top: env(safe-area-inset-top)) {
        .page-wrap { padding-top: calc(100px + env(safe-area-inset-top)); }
      }
    }
    @media (max-width: 480px) {
      .content-card { padding: 22px 16px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     NAVBAR (shared Main.js wiring)
══════════════════════════════════════════════ -->
<nav id="navbar">
  <div class="nav-inner">

    <!-- Logo -->
    <a class="nav-logo" href="index.html">
      <!-- PLACE YOUR LOGO IMAGE HERE: public/assets/logo.png -->
      <img src="assets/logo.png" alt="Shax Store">
      <span class="nav-logo-text">SHAX<span style="color:#fff;font-weight:400"> STORE</span></span>
    </a>

    <!-- Desktop Nav Links -->
    <div class="nav-links">
      <a class="nav-link" href="index.html"          data-i18n="nav_home">Home</a>
      <a class="nav-link" href="index.html#products"  data-i18n="nav_products">Products</a>
      <!-- ABOUT — paste your external About page link inside href="" below -->
      <a class="nav-link" href="PASTE_ABOUT_PAGE_LINK_HERE" target="_blank" rel="noopener" data-i18n="nav_about">About</a>
      <a class="nav-link" href="index.html#footer"    data-i18n="nav_contact">Contact</a>
    </div>

    <!-- Right Controls -->
    <div class="nav-right">

      <!-- Language Selector -->
      <div class="lang-dropdown" id="lang-dropdown-desktop">
        <button type="button" class="lang-btn" onclick="toggleLangMenu('lang-dropdown-desktop')"
                aria-haspopup="true" aria-expanded="false" title="Language">
          <!-- PLACE FLAG IMAGES HERE: public/assets/flags/en.png, ku.svg, ar.svg -->
          <img class="flag-icon lang-btn-flag" src="assets/flags/en.png" alt="">
          <span class="lang-btn-code">EN</span>
          <i class="fas fa-chevron-down" style="font-size:0.65rem;opacity:.6"></i>
        </button>
        <div class="lang-menu">
          <div class="lang-option" data-lang="en" onclick="selectLanguage('en')">
            <img class="flag-icon" src="assets/flags/en.png" alt="English"><span>English</span>
          </div>
          <div class="lang-option" data-lang="ku" onclick="selectLanguage('ku')">
            <img class="flag-icon" src="assets/flags/ku.png" alt="Kurdish"><span>کوردی</span>
          </div>
          <div class="lang-option" data-lang="ar" onclick="selectLanguage('ar')">
            <img class="flag-icon" src="assets/flags/ar.png" alt="Arabic"><span>العربية</span>
          </div>
        </div>
      </div>

      <!-- User Menu -->
      <div id="nav-user-menu" class="user-menu-wrap" style="display:none">
        <button class="user-btn" onclick="toggleUserDropdown()">
          <i class="fas fa-user-circle"></i>
          <span id="user-name"></span>
          <i class="fas fa-chevron-down" style="font-size:0.65rem;opacity:.6"></i>
        </button>
        <div id="user-dropdown">
          <a class="dropdown-item" href="account.html">
            <i class="fas fa-box-open"></i>
            <span data-i18n="my_orders">My Orders</span>
          </a>
          <a class="dropdown-item" id="admin-panel-link" href="admin/index.html" style="display:none">
            <i class="fas fa-cog"></i>
            Admin Panel
          </a>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" onclick="logout(); window.location.href='index.html'">
            <i class="fas fa-sign-out-alt"></i>
            <span data-i18n="logout">Logout</span>
          </div>
        </div>
      </div>

      <!-- Auth buttons (shown when logged out; hidden by updateAuthUI when logged in) -->
      <div id="nav-auth-buttons" style="display:flex;gap:10px">
        <button class="btn btn-gold btn-sm" onclick="window.location.href='index.html'">
          <span data-i18n="sign_in">Sign In</span>
        </button>
      </div>

      <!-- Theme Toggle -->
      <button class="theme-toggle" type="button" onclick="toggleTheme()"
              title="Toggle light/dark theme" aria-label="Toggle light/dark theme" aria-pressed="false">
        <i class="fas fa-moon"></i>
      </button>

    </div>
  </div>
</nav>

<!-- ═══════════════════════════════════════════
     SHIPPING CONTENT
══════════════════════════════════════════════ -->
<div class="page-wrap">
  <div class="page-head">
    <div class="page-icon"><i class="fas fa-truck-fast"></i></div>
    <h1 class="page-title"><span data-i18n="shipping_info">Shipping Info</span></h1>
    <p class="page-subtitle" data-i18n="shipping_subtitle">Everything you need to know about delivery</p>
  </div>

  <div class="content-card">
    <div id="shipping-content">
      <div class="content-loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p data-i18n="loading">Loading…</p>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     TOAST CONTAINER
══════════════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ═══════════════════════════════════════════
     SCRIPTS
══════════════════════════════════════════════ -->
<!-- Shared Main.js: STATE, api(), t(), escapeHtml(), verifySession(), logout(), lang + navbar wiring -->
<script src="Main.js"></script>

<!-- Shipping-page logic (reuses Main.js globals) -->
<script>
(function () {
  'use strict';

  async function loadShipping() {
    const box = document.getElementById('shipping-content');
    try {
      const data = await api('/content/shipping_info');
      const text = (data && data.content) ? data.content.trim() : '';

      if (!text) {
        box.innerHTML = `
          <div class="content-empty">
            <i class="fas fa-box-open"></i>
            <p>${t('shipping_empty')}</p>
          </div>`;
        return;
      }
      // escapeHtml keeps it safe; white-space:pre-wrap in CSS preserves line breaks
      box.innerHTML = `<div class="content-body">${escapeHtml(text)}</div>`;
    } catch (err) {
      box.innerHTML = `
        <div class="content-empty">
          <i class="fas fa-triangle-exclamation"></i>
          <p>${t('shipping_error')}</p>
        </div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadShipping);
})();
</script>

</body>
</html>
